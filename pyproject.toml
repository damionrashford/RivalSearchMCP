[project]
name = "rivalsearchmcp"
version = "1.0.0"
description = "Advanced web research and content discovery MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pillow>=10.0.0",
    "websockets>=11.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "typing-extensions>=4.8.0",
    "pydantic>=2.5.0",
    "pytrends==4.9.2",
    "pandas>=2.2.0",
    "urllib3<2.0.0",
    "python-dotenv>=1.0.0",
    "openrouter>=0.0.1",
    "fastmcp>=2.12.5",
    "markdown>=3.5.0",
    "feedparser>=6.0.12",
    "pypdf>=6.6.0",
    "python-docx>=1.2.0",
    "easyocr>=1.7.2",
    "tavily-python>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "ruff>=0.0.285",
    "mypy>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
